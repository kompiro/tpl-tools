name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
      - name: Smoke-test built CLI
        run: |
          node dist/cli.js --help
          mkdir -p /tmp/tpl-smoke
          node dist/cli.js init /tmp/tpl-smoke
          test -f /tmp/tpl-smoke/tpl.config.json
          node dist/cli.js validate --tpl-dir test/fixtures/tpl --config test/fixtures/reference-data.json
          node dist/cli.js related testing --tpl-dir test/fixtures/tpl
          cp -r test/fixtures/tpl /tmp/tpl-regen
          jq '. + {indexFile: "index.md"}' test/fixtures/reference-data.json > /tmp/tpl-regen.json
          node dist/cli.js regenerate --tpl-dir /tmp/tpl-regen --config /tmp/tpl-regen.json
          node dist/cli.js regenerate --check --tpl-dir /tmp/tpl-regen --config /tmp/tpl-regen.json
          node dist/cli.js validate --tpl-dir /tmp/tpl-regen --config /tmp/tpl-regen.json
          cp -r test/fixtures/tpl /tmp/tpl-noindex
          jq '. + {indexFile: "index.md", indexCheck: false}' test/fixtures/reference-data.json > /tmp/tpl-noindex.json
          node dist/cli.js validate --tpl-dir /tmp/tpl-noindex --config /tmp/tpl-noindex.json
          node dist/cli.js review-body --tpl-dir test/fixtures/tpl --repo kompiro/example > /dev/null
          node dist/cli.js validate --tpl-dir test/fixtures/tpl-checklist --config test/fixtures/checklist-config.json --source-prefix src
          node dist/cli.js related testing --status --tpl-dir test/fixtures/tpl-checklist --config test/fixtures/checklist-config.json | grep -q 'guarded 1/1, judgment 1'
          node dist/cli.js checklist --marker unguarded --tpl-dir test/fixtures/tpl-checklist --config test/fixtures/checklist-config.json | grep -q '^TPL-20260102-02'
          node dist/cli.js related --changed-files src/checklist.ts --source-prefix src --tpl-dir test/fixtures/tpl-checklist --config test/fixtures/checklist-config.json | grep -q 'TPL-20260102-01.*via `src/checklist.ts`'
          node dist/cli.js related --base HEAD --source-prefix src --tpl-dir test/fixtures/tpl-checklist --config test/fixtures/checklist-config.json
